name: Store-Katalog aktualisieren

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten
  release:
    types: [published, edited, deleted]
  workflow_dispatch:          # manuell: Actions -> "Store-Katalog aktualisieren" -> Run workflow

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # auch bei Release-Auslösern immer den Hauptzweig nutzen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Katalog bauen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/build_catalog.py
      - name: Speichern (nur bei Änderungen)
        run: |
          if git diff --quiet -- catalog.json && git ls-files --error-unmatch catalog.json >/dev/null 2>&1; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "aether-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Katalog aktualisiert"
          git pull --rebase origin main || true
          git push origin HEAD:main
